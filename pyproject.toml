[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locryp"
version = "0.1.0"
description = "Proof-carrying consistency checks for the algebra behind cryptographic parameters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
locryp = "locryp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
